[mod]
id = "infinite_zoom"
version = "1.1.0"
priority = 200

# Tested-source pin. Engine implementation hooks can change in future Nightlies.
[compatibility]
horizon_revision = "2ebf00a0281c592f79191e76fce0e7d522c6f425"

# The stock native_zoom_now path clamps native mods to 10x and enforces
# a 0.05 turn-rate floor. This cancellable HEAD hook preserves ordinary
# Horizon behavior unless Infinite Zoom is enabled and currently held.
# Unlike an unused helper file, this hook actually executes at runtime.
[[injection]]
id = "unclamp_active_zoom"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::native_hooks::Game<'_>::native_zoom_now"
helper = "zoom_engine.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
]

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "infinite_zoom"
source = "runtime.rs"

[[injection]]
id = "key"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_key"
helper = "key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" },
]

[[injection]]
id = "wheel"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_wheel"
helper = "wheel.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "steps", ty = "f32", value = "steps" },
  { name = "claimed", ty = "&mut bool", value = "&mut *claimed" },
]

[[injection]]
id = "zoom"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_zoom"
helper = "zoom.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "zoom", ty = "&mut Option<crate::game::native_hooks::NativeZoom>", value = "&mut *zoom" },
]

[[injection]]
id = "hud"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_hud"
helper = "hud.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "corners", ty = "&mut horizon_client::extras_hud::Corners", value = "&mut *corners" },
]

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings_click"
helper = "click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]

# The HEAD hook above supplies the actual engine-cap fix.\n