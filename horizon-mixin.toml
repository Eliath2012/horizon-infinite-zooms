[mod]
id = "infinite_zoom"
version = "1.0.0"
priority = 200

# Tested-source pin. Engine implementation hooks can change in future Nightlies.
[compatibility]
horizon_revision = "6f8c7a0e5d531d3834c4d0be4659a1db8e7e5c2a"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "infinite_zoom"
source = "runtime.rs"

[[injection]]
id = "key"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_key"
helper = "key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" },
]

[[injection]]
id = "wheel"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_wheel"
helper = "wheel.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "steps", ty = "f32", value = "steps" },
  { name = "claimed", ty = "&mut bool", value = "&mut *claimed" },
]

[[injection]]
id = "zoom"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_zoom"
helper = "zoom.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "zoom", ty = "&mut Option<crate::game::native_hooks::NativeZoom>", value = "&mut *zoom" },
]

[[injection]]
id = "hud"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_hud"
helper = "hud.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "corners", ty = "&mut horizon_client::extras_hud::Corners", value = "&mut *corners" },
]

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings_click"
helper = "click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]

# Critical: Horizon itself clamps the result of the native_zoom hook to 10x.
# Modify exactly the 10.0 literal in native_zoom_now to permit up to 1,000,000x.
[[injection]]
id = "engine_cap"
kind = "MODIFY_CONSTANT"
target = "horizon_client::game::native_hooks::Game<'_>::native_zoom_now"
helper = "engine_cap.rs"
selector = "10.0"
require = 1
ordinal = 0
bindings = [{ name = "old", ty = "f32", value = "$value" }]

# Horizon also clamps mouse turn speed to no less than 5%, too high for huge zoom.
[[injection]]
id = "engine_turn_min"
kind = "MODIFY_CONSTANT"
target = "horizon_client::game::native_hooks::Game<'_>::native_zoom_now"
helper = "engine_turn.rs"
selector = "0.05"
require = 1
ordinal = 0
bindings = [{ name = "old", ty = "f32", value = "$value" }]
